[project]
name = "multivariate-prep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mne>=1.12.1",
    "numpy>=2.5.1",
    "pamica",
    "scipy>=1.18.0",
]

# torch (pulled in transitively by pamica) is CPU-only from PyPI on Windows.
# These extras pick the build explicitly: `uv sync` / `uv sync --extra cpu`
# (default, works everywhere, matches this machine) vs `uv sync --extra cuda`
# on a machine with an NVIDIA GPU. See setup-venv.ps1 -Cuda.
[project.optional-dependencies]
cpu = ["torch>=2.12.1"]
cuda = ["torch>=2.12.1"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
pamica = { path = "../pAMICA", editable = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

# cu126 is the newest CUDA channel that actually carries torch 2.13.0 for
# win_amd64 as of writing (cu128/cu129/cu130 don't have a win_amd64 2.13.0
# wheel yet); it needs a driver new enough for CUDA 12.6 (check `nvidia-smi`'s
# "CUDA Version" field). If a newer win_amd64 wheel shows up on a later cuXXX
# channel, repoint this at it -- see download.pytorch.org/whl/<channel>/torch/.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
